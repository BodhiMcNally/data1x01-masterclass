name: Render and publish presentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.11.9'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          Rscript -e 'install.packages("ggplot2", repos="https://cloud.r-project.org")'
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
      - name: Render and check
        run: |
          python scripts/validate_slide_questions.py
          quarto render masterclass.qmd --to revealjs
          python scripts/check_statistics.py
          python scripts/prepare_web_publish.py
      - name: Save downloadable presentation
        uses: actions/upload-artifact@v4
        with:
          name: presentation-${{ github.sha }}
          path: masterclass.html
      - name: Publish to existing Cloudflare Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_WORKER_NAME != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          WRANGLER_SEND_METRICS: 'false'
        working-directory: live-questions
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add the Cloudflare deployment token in repository secrets."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add the Cloudflare account ID in repository secrets."; exit 1; }
          npx --yes wrangler@4.150.0 deploy --name "$CLOUDFLARE_WORKER_NAME"
